name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: lua5.4 -e 'assert(loadfile("main.lua"))'
      - name: Check shell syntax
        run: sh -n assets/render.sh
      - name: Check Python syntax
        run: python3 -m py_compile assets/render.py
      - name: Test preload wiring
        run: lua5.4 test/preload_test.lua
